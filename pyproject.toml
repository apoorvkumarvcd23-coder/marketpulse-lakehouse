[project]
name = "marketpulse-lakehouse"
version = "0.1.0"
description = "A production-style cryptocurrency data lakehouse built as a 90-day learning project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marketpulse"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
markers = [
    "integration: validates a boundary with external service tooling",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
