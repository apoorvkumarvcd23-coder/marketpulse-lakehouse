name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-batch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.5"
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run marketpulse doctor
      - name: Actual offline month-plan CLI and read-only data preservation
        run: uv run python scripts/demo_plan.py --artifacts artifacts/month-plan
      - run: |
          uv run marketpulse make-fixture
          uv run marketpulse batch-day --date 2024-01-01 --fixture-dir data/fixture
          uv run marketpulse batch-day --date 2024-01-01 --fixture-dir data/fixture
      - run: uv run python -m playwright install --with-deps chromium
      - name: Actual offline CLI rejection replay and Chromium dashboard walkthrough
        run: uv run python scripts/demo_batch.py --artifacts artifacts/clean-integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketpulse-clean-integration
          path: |
            artifacts/clean-integration/integration.json
            artifacts/clean-integration/*.png
            artifacts/month-plan/*.json
